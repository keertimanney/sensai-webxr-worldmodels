<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>sensai-webxr-worldmodels</title>
  </head>
  <body style="margin: 0">
    <div id="scene-container" style="background:#000"></div>

    <div id="splat-controls" style="
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-family: system-ui, sans-serif;
      font-size: 14px;
    ">

    <select id="splat-picker" style="
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 9999;
      padding: 8px 12px;
      font-size: 14px;
      font-family: system-ui, sans-serif;
      background: rgba(0,0,0,0.7);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      cursor: pointer;
    ">
      <option value="./splats/worldlabs-100k.spz">World Labs — 100k</option>
      <option value="./splats/worldlabs-500k.spz">World Labs — 500k</option>
      <option value="./splats/worldlabs-full.spz">World Labs — Full Res</option>
      <option value="./splats/sensai.spz">Sensai (original)</option>
    </select>

    <div style="display:flex; gap:6px; align-items:center;">
      <label style="color:#fff; min-width:55px;">Rot X</label>
      <input id="rot-x" type="range" min="-180" max="180" value="0" style="flex:1;">
      <span id="rot-x-val" style="color:#fff; min-width:40px;">0°</span>
    </div>
    <div style="display:flex; gap:6px; align-items:center;">
      <label style="color:#fff; min-width:55px;">Rot Y</label>
      <input id="rot-y" type="range" min="-180" max="180" value="0" style="flex:1;">
      <span id="rot-y-val" style="color:#fff; min-width:40px;">0°</span>
    </div>
    <div style="display:flex; gap:6px; align-items:center;">
      <label style="color:#fff; min-width:55px;">Rot Z</label>
      <input id="rot-z" type="range" min="-180" max="180" value="0" style="flex:1;">
      <span id="rot-z-val" style="color:#fff; min-width:40px;">0°</span>
    </div>

    <div style="display:flex; gap:6px; align-items:center;">
      <label style="color:#fff; min-width:55px;">Pos Y</label>
      <input id="pos-y" type="range" min="-10" max="10" value="1.5" step="0.1" style="flex:1;">
      <span id="pos-y-val" style="color:#fff; min-width:40px;">1.5</span>
    </div>

    <label style="display:flex; gap:6px; align-items:center; color:#fff; cursor:pointer;">
      <input id="collider-toggle" type="checkbox">
      Show Collider Mesh
    </label>

    <div style="display:flex; gap:6px; align-items:center;">
      <label style="color:#fff; min-width:95px;">Collider Scale</label>
      <input id="collider-scale" type="range" min="0.2" max="3.0" step="0.01" value="1.00" style="flex:1;">
      <span id="collider-scale-val" style="color:#fff; min-width:40px;">1.00</span>
    </div>
    <div style="display:flex; gap:6px; align-items:center;">
      <label style="color:#fff; min-width:95px;">Collider Yaw</label>
      <input id="collider-yaw" type="range" min="-180" max="180" step="1" value="180" style="flex:1;">
      <span id="collider-yaw-val" style="color:#fff; min-width:40px;">180°</span>
    </div>
    <div style="display:flex; gap:6px; align-items:center;">
      <label style="color:#fff; min-width:95px;">Collider Pos X</label>
      <input id="collider-off-x" type="range" min="-5" max="5" step="0.01" value="0" style="flex:1;">
      <span id="collider-off-x-val" style="color:#fff; min-width:40px;">0.00</span>
    </div>
    <div style="display:flex; gap:6px; align-items:center;">
      <label style="color:#fff; min-width:95px;">Collider Pos Y</label>
      <input id="collider-off-y" type="range" min="-5" max="5" step="0.01" value="0" style="flex:1;">
      <span id="collider-off-y-val" style="color:#fff; min-width:40px;">0.00</span>
    </div>
    <div style="display:flex; gap:6px; align-items:center;">
      <label style="color:#fff; min-width:95px;">Collider Pos Z</label>
      <input id="collider-off-z" type="range" min="-5" max="5" step="0.01" value="0" style="flex:1;">
      <span id="collider-off-z-val" style="color:#fff; min-width:40px;">0.00</span>
    </div>

    <label style="display:flex; gap:6px; align-items:center; color:#fff; cursor:pointer;">
      <input id="nav-toggle" type="checkbox">
      Show Nav Graph
    </label>

    <label style="display:flex; gap:6px; align-items:center; color:#fff; cursor:pointer;">
      <input id="grid-toggle" type="checkbox">
      Show Grid
    </label>

    </div>

    <button id="capture-btn" style="
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      padding: 12px 24px;
      font-size: 16px;
      font-family: system-ui, sans-serif;
      font-weight: 600;
      background: rgba(79, 195, 247, 0.9);
      color: #000;
      border: none;
      border-radius: 24px;
      cursor: pointer;
      box-shadow: 0 2px 12px rgba(79, 195, 247, 0.4);
    ">Capture View</button>

    <!-- Preview overlay for captured screenshot -->
    <div id="capture-preview" style="
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(0,0,0,0.85);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    ">
      <img id="capture-img" style="
        max-width: 80vw;
        max-height: 50vh;
        border-radius: 8px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.5);
      ">
      <div id="analysis-box" style="
        max-width: 80vw;
        padding: 16px 20px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 8px;
        color: #fff;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        white-space: pre-wrap;
      ">Analyzing...</div>
      <div style="display:flex; gap:12px;">
        <button id="capture-download" style="
          padding: 10px 20px;
          font-size: 14px;
          font-family: system-ui, sans-serif;
          background: #4fc3f7;
          color: #000;
          border: none;
          border-radius: 8px;
          cursor: pointer;
        ">Download</button>
        <button id="capture-close" style="
          padding: 10px 20px;
          font-size: 14px;
          font-family: system-ui, sans-serif;
          background: rgba(255,255,255,0.15);
          color: #fff;
          border: 1px solid rgba(255,255,255,0.2);
          border-radius: 8px;
          cursor: pointer;
        ">Close</button>
      </div>
    </div>

    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
